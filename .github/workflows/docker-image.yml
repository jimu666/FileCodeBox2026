name: Build & Push ARMv7 Docker Image to GHCR

on:
  workflow_dispatch:   # 手动触发

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout 仓库
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ 设置 QEMU（支持 ARM 架构交叉构建）
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3️⃣ 设置 Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4️⃣ 登录 GHCR（使用 GitHub 提供的 token）
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5️⃣ 构建 ARMv7 镜像并加载到本地 Docker
      - name: Build ARMv7 Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.armv7l
          platforms: linux/arm/v7
          load: true
          tags: fileboxcode-armv7-image:latest
          push: false   # 先不推送

      # 6️⃣ 保存 tar 作为 artifact
      - name: Save image to tar
        run: |
          docker save fileboxcode-armv7-image:latest -o fileboxcode-armv7-image.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: armv7-docker-image
          path: fileboxcode-armv7-image.tar

      # 7️⃣ 给 GHCR 打 tag 并推送
      - name: Tag and Push to GHCR
        run: |
          # 设置 GHCR 镜像名
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/fileboxcode-armv7:latest"

          # 打 tag
          docker tag fileboxcode-armv7-image:latest $IMAGE_NAME

          # 推送到 GHCR
          docker push $IMAGE_NAME

      # 8️⃣ 验证
      - name: List Docker images
        run: docker images | grep fileboxcode-armv7
