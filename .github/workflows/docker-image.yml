
name: Build ARMv7 Docker Image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout 仓库
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 QEMU
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3. 设置 Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. 构建 ARMv7 镜像
      - name: Build ARMv7 Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm/v7
          outputs: type=docker,dest=/tmp/fileboxcode-armv7-image.tar

      # 5. 上传 Artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fileboxcode-armv7-image
          path: /tmp/fileboxcode-armv7-image.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
